<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage Concierge — How It Works</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy-900: #0f2658;
    --navy-800: #1e3a8a;
    --navy-700: #1e40af;
    --blue-600: #2563eb;
    --blue-500: #3b82f6;
    --blue-50: #eff6ff;
    --blue-100: #dbeafe;
    --teal-600: #0d9488;
    --teal-50: #f0fdfa;
    --teal-100: #ccfbf1;
    --green-700: #15803d;
    --green-600: #16a34a;
    --green-50: #f0fdf4;
    --green-100: #dcfce7;
    --orange-700: #c2410c;
    --orange-600: #ea580c;
    --orange-50: #fff7ed;
    --orange-100: #ffedd5;
    --purple-700: #6d28d9;
    --purple-600: #7c3aed;
    --purple-50: #faf5ff;
    --purple-100: #ede9fe;
    --pink-700: #be185d;
    --pink-600: #db2777;
    --pink-50: #fdf2f8;
    --pink-100: #fce7f3;
    --amber-700: #b45309;
    --amber-600: #d97706;
    --amber-50: #fffbeb;
    --amber-100: #fef3c7;
    --red-700: #b91c1c;
    --red-600: #dc2626;
    --red-50: #fef2f2;
    --red-100: #fee2e2;
    --slate-900: #0f172a;
    --slate-800: #1e293b;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-300: #cbd5e1;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --slate-50: #f8fafc;
    --white: #ffffff;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--slate-50);
    min-height: 100vh;
    color: var(--slate-900);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--slate-300); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--slate-400); }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ============ HEADER ============ */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--slate-200);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .header-logo {
    width: 44px;
    height: 44px;
    background: var(--navy-800);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 22px;
    font-weight: 700;
  }

  .header-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--slate-900);
    letter-spacing: -0.2px;
  }

  .header-subtitle {
    font-size: 12px;
    color: var(--slate-500);
    font-weight: 500;
    margin-top: 2px;
  }

  .header-restart {
    background: var(--white);
    color: var(--slate-700);
    border: 1px solid var(--slate-300);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    transition: all 0.15s;
  }

  .header-restart:hover {
    background: var(--slate-50);
    border-color: var(--slate-400);
  }

  /* ============ STEP NAV ============ */
  .step-nav-wrapper {
    background: var(--white);
    border-bottom: 1px solid var(--slate-200);
    padding: 0 32px;
    overflow-x: auto;
  }

  .step-nav {
    display: flex;
    gap: 0;
    min-width: max-content;
  }

  .step-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 14px 18px;
    font-family: inherit;
    font-size: 13px;
    color: var(--slate-500);
    font-weight: 500;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }

  .step-tab:hover {
    color: var(--slate-900);
    background: var(--slate-50);
  }

  .step-tab.active {
    color: var(--navy-800);
    border-bottom-color: var(--navy-800);
    font-weight: 600;
  }

  .step-tab.completed { color: var(--slate-700); }
  .step-tab.completed .step-num { background: var(--slate-700); color: white; }

  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    background: var(--slate-200);
    color: var(--slate-500);
    flex-shrink: 0;
  }

  .step-tab.active .step-num {
    background: var(--navy-800);
    color: white;
  }

  /* ============ MAIN LAYOUT ============ */
  .main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 24px;
    padding: 24px 32px 48px;
    max-width: 1500px;
    margin: 0 auto;
    align-items: start;
  }

  .step-content {
    animation: slideUp 0.4s ease;
    min-width: 0;
  }

  /* ============ DAY BANNER ============ */
  .banner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .banner-pill {
    background: var(--navy-800);
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  .banner-text {
    font-size: 14px;
    color: var(--slate-700);
    line-height: 1.5;
  }

  .banner-text strong { color: var(--slate-900); font-weight: 600; }

  /* ============ AGENT INFO CARD ============ */
  .agent-info {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-left: 4px solid var(--navy-800);
    border-radius: 0 10px 10px 0;
    padding: 18px 22px;
    margin-bottom: 24px;
  }

  .agent-info-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--navy-800);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .agent-info-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--slate-900);
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .agent-info-text {
    font-size: 13px;
    color: var(--slate-600);
    line-height: 1.65;
  }

  .agent-info-text strong { color: var(--slate-900); font-weight: 600; }

  /* ============ CARD ============ */
  .card {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .card-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--slate-500);
    margin-bottom: 10px;
  }

  /* ============ DOMAIN BADGES ============ */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    border: 1px solid;
    line-height: 1;
    white-space: nowrap;
  }

  .badge-instagram { background: var(--pink-50); color: var(--pink-700); border-color: var(--pink-100); }
  .badge-reddit { background: var(--orange-50); color: var(--orange-700); border-color: var(--orange-100); }
  .badge-cdp { background: var(--green-50); color: var(--green-700); border-color: var(--green-100); }
  .badge-ai { background: var(--purple-50); color: var(--purple-700); border-color: var(--purple-100); }
  .badge-jo { background: var(--amber-50); color: var(--amber-700); border-color: var(--amber-100); }
  .badge-email { background: var(--blue-50); color: var(--navy-800); border-color: var(--blue-100); }
  .badge-sms { background: var(--teal-50); color: var(--teal-600); border-color: var(--teal-100); }
  .badge-website { background: var(--slate-100); color: var(--slate-700); border-color: var(--slate-200); }
  .badge-ads { background: var(--amber-50); color: var(--amber-700); border-color: var(--amber-100); }
  .badge-google { background: var(--blue-50); color: var(--blue-600); border-color: var(--blue-100); }

  /* ============ PERSONA CARD ============ */
  .persona-card {
    background: var(--navy-800);
    border-radius: 14px;
    padding: 28px;
    color: white;
    margin-bottom: 20px;
  }

  .persona-header {
    display: flex;
    gap: 18px;
    margin-bottom: 20px;
  }

  .persona-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
    border: 2px solid rgba(255, 255, 255, 0.25);
  }

  .persona-name {
    font-size: 22px;
    font-weight: 700;
    color: white;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }

  .persona-meta {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 500;
    margin-bottom: 8px;
  }

  .persona-occupation {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.95);
    line-height: 1.5;
  }

  .persona-grid {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    padding: 16px 18px;
  }

  .persona-grid-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 13px;
  }

  .persona-grid-row:last-child { border-bottom: none; }

  .persona-grid-key {
    color: rgba(255, 255, 255, 0.7);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
  }

  .persona-grid-val {
    color: white;
    font-weight: 600;
    text-align: right;
  }

  /* ============ BUTTONS ============ */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--navy-800);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.15s;
  }

  .btn:hover { background: var(--navy-900); }

  .btn-outline {
    background: var(--white);
    color: var(--navy-800);
    border: 1px solid var(--slate-300);
  }

  .btn-outline:hover { background: var(--slate-50); border-color: var(--navy-800); }

  /* ============ CDP SIDE PANEL ============ */
  .cdp-panel {
    position: sticky;
    top: 16px;
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }

  .cdp-header {
    background: var(--slate-50);
    border-bottom: 1px solid var(--slate-200);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cdp-header-title {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--slate-900);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .cdp-status {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--green-50);
    color: var(--green-700);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.5px;
    border: 1px solid var(--green-100);
  }

  .cdp-status-dot {
    width: 6px;
    height: 6px;
    background: var(--green-600);
    border-radius: 50%;
    animation: pulse-dot 1.6s infinite;
  }

  .cdp-events {
    max-height: 580px;
    overflow-y: auto;
    padding: 12px 16px;
  }

  .cdp-event {
    padding: 10px 0;
    border-bottom: 1px dashed var(--slate-200);
    animation: slideUp 0.3s ease;
  }

  .cdp-event:last-child { border-bottom: none; }

  .cdp-event-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .cdp-event-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--slate-500);
    font-weight: 600;
  }

  .cdp-event-text {
    font-size: 12.5px;
    color: var(--slate-700);
    line-height: 1.5;
  }

  .cdp-empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--slate-400);
    font-size: 12px;
  }

  /* ============ DATA GRID ============ */
  .data-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .data-cell {
    background: var(--slate-50);
    border: 1px solid var(--slate-200);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .data-cell-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--slate-500);
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .data-cell-value {
    font-size: 13.5px;
    color: var(--slate-900);
    font-weight: 600;
    line-height: 1.4;
  }

  /* ============ STAT CARDS ============ */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }

  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--slate-500);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--navy-800);
    line-height: 1;
  }

  .stat-value-green { color: var(--green-700); }
  .stat-value-orange { color: var(--orange-700); }

  .stat-sublabel {
    font-size: 11px;
    color: var(--slate-500);
    font-weight: 500;
    margin-top: 4px;
  }

  /* ============ INSTAGRAM POST MOCKUP ============ */
  .ig-post {
    max-width: 360px;
    margin: 0 auto 20px;
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 12px;
    overflow: hidden;
  }

  .ig-post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--slate-100);
  }

  .ig-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--pink-100);
    color: var(--pink-700);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .ig-username {
    font-size: 13px;
    font-weight: 600;
    color: var(--slate-900);
  }

  .ig-location {
    font-size: 11px;
    color: var(--slate-500);
  }

  .ig-image {
    background: var(--slate-100);
    height: 200px;
    overflow: hidden;
    position: relative;
  }

  .ig-caption {
    padding: 14px;
  }

  .ig-actions {
    display: flex;
    gap: 16px;
    padding-bottom: 8px;
    color: var(--slate-700);
  }

  .ig-stats {
    font-size: 12px;
    color: var(--slate-700);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .ig-text {
    font-size: 13px;
    color: var(--slate-900);
    line-height: 1.5;
  }

  .ig-text strong { font-weight: 600; }

  .ig-meta {
    font-size: 11px;
    color: var(--slate-500);
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 500;
  }

  /* ============ EMAIL MOCKUP ============ */
  .email-mockup {
    background: var(--white);
    border: 1px solid var(--slate-200);
    border-radius: 10px;
    overflow: hidden;
  }

  .email-header {
    background: var(--slate-50);
    border-bottom: 1px solid var(--slate-200);
    padding: 14px 18px;
  }

  .email-meta-row {
    display: flex;
    gap: 8px;
    font-size: 12px;
    color: var(--slate-600);
    margin-bottom: 4px;
  }

  .email-meta-row strong { color: var(--slate-900); font-weight: 600; }

  .email-subject {
    font-size: 14px;
    color: var(--slate-900);
    font-weight: 600;
    margin-top: 4px;
  }

  .email-body {
    padding: 18px;
    font-size: 13.5px;
    color: var(--slate-700);
    line-height: 1.7;
  }

  .email-body strong { color: var(--slate-900); font-weight: 600; }

  .email-engagement {
    background: var(--green-50);
    border-top: 1px solid var(--green-100);
    padding: 10px 18px;
    font-size: 12px;
    color: var(--green-700);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ============ SMS MOCKUP ============ */
  .sms-mockup {
    background: #ebebef;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid var(--slate-200);
  }

  .sms-from {
    text-align: center;
    padding-bottom: 12px;
    border-bottom: 1px solid #d8d8de;
    margin-bottom: 12px;
  }

  .sms-from-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--slate-900);
  }

  .sms-from-number {
    font-size: 10px;
    color: var(--slate-500);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  .sms-bubble {
    background: white;
    border-radius: 16px 16px 16px 4px;
    padding: 10px 14px;
    margin-bottom: 8px;
    max-width: 88%;
    font-size: 13px;
    color: var(--slate-900);
    line-height: 1.5;
  }

  .sms-bubble-link {
    color: var(--blue-600);
    text-decoration: underline;
  }

  .sms-time {
    font-size: 10px;
    color: var(--slate-500);
    text-align: right;
    margin-top: 4px;
  }

  .sms-disclaimer {
    text-align: center;
    font-size: 10px;
    color: var(--slate-500);
    padding-top: 8px;
  }

  /* ============ CHAT BUBBLE ============ */
  .chat-thread {
    background: var(--slate-50);
    border-radius: 10px;
    padding: 16px;
    border: 1px solid var(--slate-200);
  }

  .chat-msg {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    align-items: flex-start;
  }

  .chat-msg:last-child { margin-bottom: 0; }

  .chat-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .chat-avatar-user {
    background: var(--pink-100);
    color: var(--pink-700);
  }

  .chat-avatar-ai {
    background: var(--navy-800);
    color: white;
  }

  .chat-bubble {
    border-radius: 12px;
    padding: 12px 16px;
    max-width: 80%;
    font-size: 13.5px;
    line-height: 1.6;
  }

  .chat-bubble-user {
    background: var(--white);
    border: 1px solid var(--slate-200);
    color: var(--slate-900);
    border-radius: 12px 12px 12px 4px;
  }

  .chat-bubble-ai {
    background: var(--navy-800);
    color: white;
    border-radius: 12px 12px 4px 12px;
  }

<body>

<div class="header">
  <div class="header-brand">
    <div class="header-logo">V</div>
    <div>
      <div class="header-title">Voyage Concierge</div>
      <div class="header-subtitle">Agentic AI · Travel lead lifecycle walkthrough</div>
    </div>
  </div>
  <button class="header-restart" onclick="resetDemo()">Restart</button>
</div>

<div class="step-nav-wrapper">
  <div class="step-nav" id="step-nav"></div>
</div>

<div class="main">
  <div id="step-content" class="step-content"></div>

  <aside class="cdp-panel">
    <div class="cdp-header">
      <div class="cdp-header-title">Customer Data Platform</div>
      <div class="cdp-status">
        <span class="cdp-status-dot"></span>
        <span>LIVE</span>
      </div>
    </div>
    <div class="cdp-events" id="cdp-events">
      <div class="cdp-empty">Awaiting first signal...</div>
    </div>
  </aside>
</div>

<script>
let currentStep = 0;
let cdpEvents = [];

const PERSONA = {
  name: "Sarah Mitchell",
  age: 32,
  city: "Austin, TX",
  zip: "78704",
  occupation: "Marketing Director, SaaS startup",
  household: "Single, no children",
  income: "USD 145,000 to 165,000 / year",
  email: "sarah.mitchell92@gmail.com",
  phone: "+1 512-555-0184",
  travel_history: "Cancun (Jan 2023), Park City (Mar 2022), Tokyo (Sep 2024)",
  segment: "Premium Solo Traveler",
  ltv_estimate: "USD 8,500 over 5 years",
  relationship: "Newsletter subscriber since 2023 · Booked Cancun trip Jan 2023",
  consent_status: "Email opt-in (2023) · SMS opt-in (at booking) · Cookies accepted"
};

const STEPS = [
  { n: 1, label: "Persona" },
  { n: 2, label: "Foundation" },
  { n: 3, label: "Signal" },
  { n: 4, label: "AI analysis" },
  { n: 5, label: "Profile build" },
  { n: 6, label: "Strategy" },
  { n: 7, label: "Email + SMS" },
  { n: 8, label: "Retargeting" },
  { n: 9, label: "Hot lead" },
  { n: 10, label: "Handoff" },
  { n: 11, label: "Booking" },
  { n: 12, label: "Recap" }
];

function addCDPEvent(text, domain, time) {
  cdpEvents.push({ text, domain, time });
  renderCDPPanel();
}

function renderCDPPanel() {
  const container = document.getElementById('cdp-events');
  if (cdpEvents.length === 0) {
    container.innerHTML = '<div class="cdp-empty">Awaiting first signal...</div>';
    return;
  }
  container.innerHTML = cdpEvents.map(e => `
    <div class="cdp-event">
      <div class="cdp-event-meta">
        <span class="badge badge-${e.domain}">${getDomainLabel(e.domain)}</span>
        <span class="cdp-event-time">${e.time}</span>
      </div>
      <div class="cdp-event-text">${e.text}</div>
    </div>
  `).join('');
  container.scrollTop = container.scrollHeight;
}

function getDomainLabel(d) {
  const map = {
    instagram: 'Instagram',
    reddit: 'Reddit',
    cdp: 'CDP',
    ai: 'LLM agent',
    jo: 'Orchestrator',
    email: 'Email',
    sms: 'SMS',
    website: 'Web',
    ads: 'Ads',
    google: 'Google'
  };
  return map[d] || d;
}

function getDomainColor(d) {
  const map = {
    instagram: '#db2777',
    reddit: '#ea580c',
    cdp: '#15803d',
    ai: '#7c3aed',
    jo: '#d97706',
    email: '#1e40af',
    sms: '#0d9488',
    website: '#475569',
    ads: '#d97706',
    google: '#2563eb'
  };
  return map[d] || '#475569';
}

function renderStepNav() {
  const nav = document.getElementById('step-nav');
  nav.innerHTML = STEPS.map((s, i) => {
    const cls = i === currentStep ? 'active' : (i < currentStep ? 'completed' : '');
    return `<button class="step-tab ${cls}" onclick="goToStep(${i})"><span class="step-num">${s.n}</span>${s.label}</button>`;
  }).join('');
}

function banner(pill, text, color) {
  const bg = color || 'var(--navy-800)';
  return `<div class="banner"><div class="banner-pill" style="background:${bg};">${pill}</div><div class="banner-text">${text}</div></div>`;
}

function nextBtn(label) {
  return `<button class="btn" onclick="goToStep(currentStep + 1)" style="margin-top: 20px;">${label || 'Continue →'}</button>`;
}

function badge(domain) {
  return `<span class="badge badge-${domain}">${getDomainLabel(domain)}</span>`;
}

// ============================================================
// STEP 1 — Meet the persona
// ============================================================
function renderStep1() {
  return `
    ${banner('Pre-discovery', 'Meet our lead. We have her email, but she has gone dormant. We need to re-engage her.')}

    <div class="persona-card">
      <div class="persona-header">
        <div class="persona-avatar">SM</div>
        <div style="flex:1; min-width:0;">
          <div class="persona-name">${PERSONA.name}</div>
          <div class="persona-meta">${PERSONA.age} · ${PERSONA.city} · ${PERSONA.segment}</div>
          <div class="persona-occupation">${PERSONA.occupation} · ${PERSONA.household}</div>
        </div>
      </div>
      <div class="persona-grid">
        <div class="persona-grid-row">
          <span class="persona-grid-key">Relationship</span>
          <span class="persona-grid-val" style="font-size:11.5px;">${PERSONA.relationship}</span>
        </div>
        <div class="persona-grid-row">
          <span class="persona-grid-key">Consent on file</span>
          <span class="persona-grid-val" style="font-size:11.5px;">${PERSONA.consent_status}</span>
        </div>
        <div class="persona-grid-row">
          <span class="persona-grid-key">Annual income</span>
          <span class="persona-grid-val">${PERSONA.income}</span>
        </div>
        <div class="persona-grid-row">
          <span class="persona-grid-key">Travel history</span>
          <span class="persona-grid-val" style="font-size:11.5px;">${PERSONA.travel_history}</span>
        </div>
        <div class="persona-grid-row">
          <span class="persona-grid-key">Projected lifetime value</span>
          <span class="persona-grid-val">${PERSONA.ltv_estimate}</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">The business challenge</div>
      <div style="font-size:13.5px; color:var(--slate-700); line-height:1.7;">
        Sarah booked one trip with us in 2023. Since then she has stayed on our newsletter list but has not opened
        an email in 6 months. She is what marketers call <strong style="color:var(--slate-900);">"dormant"</strong> —
        a high-value past customer drifting away.
        <br><br>
        We have <strong style="color:var(--slate-900);">lawful basis</strong> to contact her (she opted in at her 2023 booking,
        consent renewed at last newsletter interaction). What we lack is a <strong style="color:var(--slate-900);">reason to reach out</strong>
        that feels personal, not generic.
        <br><br>
        <span style="color:var(--navy-800); font-weight:600;">The question:</span> how do we know when she is dreaming
        about her next trip — so we can show up at exactly the right moment with exactly the right offer?
      </div>
    </div>

    ${nextBtn('See the data foundation →')}
  `;
}

// ============================================================
// STEP 2 — Foundation (NEW: Compliance + Data Strategy)
// ============================================================
function renderStep2() {
  return `
    ${banner('Foundation', 'Before we build the journey, we lay down the compliance and data architecture.', 'var(--green-600)')}

    <div class="agent-info">
      <div class="agent-info-label">Compliance-first data strategy</div>
      <div class="agent-info-title">We do not scrape. We orchestrate licensed and consented data.</div>
      <div class="agent-info-text">
        Every signal we use comes from one of three legal lanes. Every action requires lawful basis under
        <strong>GDPR, CCPA, and DPDP</strong>. Every record has provenance and confidence.
      </div>
    </div>

    <div class="section-h">The three legal data lanes</div>
